def matrixFile = new File(rootDir.parentFile, 'versions.json')
def matrix = new groovy.json.JsonSlurper().parse(matrixFile)
def entry = matrix.versions.find { it.mc == project.name }
if (entry == null) {
    throw new GradleException("versions.json has no entry for Minecraft ${project.name}")
}

def remapped = !entry.era.startsWith('f')

apply plugin: remapped ? 'fabric-loom' : 'net.fabricmc.fabric-loom'

version = matrix.mod_version
group = matrix.mod_group_id

base {
    archivesName = "${matrix.mod_id}-${entry.mc}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(entry.java)
    withSourcesJar()
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${entry.mc}"

    if (remapped) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${entry.fabric_loader}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${entry.fabric_api}"
    } else {
        implementation "net.fabricmc:fabric-loader:${entry.fabric_loader}"
        implementation "net.fabricmc.fabric-api:fabric-api:${entry.fabric_api}"
    }

    def compatDir = new File(rootDir.parentFile, '.compat')
    if (compatDir.isDirectory()) {
        def prefix = "${entry.mc}-fabric"
        def jars = []
        compatDir.listFiles().sort { it.name }.each { dir ->
            def main = new File(dir, "${prefix}-${dir.name}.jar")
            if (main.isFile()) {
                jars << main
            }

            def nested = new File(dir, 'nested')
            if (nested.isDirectory()) {
                nested.listFiles().findAll { it.name.startsWith("${prefix}-") && it.name.endsWith('.jar') }
                        .sort { it.name }.each { jars << it }
            }
        }
        jars.each { jar ->
            if (remapped) {
                modLocalRuntime files(jar)
            } else {
                localRuntime files(jar)
            }
        }
    }
}

project.ext.atmoLoader = 'fabric'
apply from: new File(rootDir.parentFile, 'gradle/variant-sources.gradle')

loom {
    mods {
        "${matrix.mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()

            if (project.hasProperty('gameArgs')) {
                programArgs project.property('gameArgs').toString().split(' ')
            }
        }
    }

    if (remapped) {
        mixin {
            defaultRefmapName = 'trueatmosphere.refmap.json'
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            version           : matrix.mod_version,
            loader_version    : entry.min_fabric_loader ?: matrix.min_fabric_loader,
            fabric_api_version: entry.min_fabric_api ?: matrix.min_fabric_api,
            minecraft_version : entry.mc,
            java_version      : entry.java,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = entry.java
    options.encoding = 'UTF-8'
}
