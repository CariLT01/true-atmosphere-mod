plugins {
    id 'fabric-loom' version '1.7.4'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

loom {
    mods {
        "trueatmosphere" {
            sourceSet sourceSets.main
        }
    }

    mixin {
        defaultRefmapName = 'trueatmosphere.refmap.json'
    }
}

sourceSets {
    main {
        java {
            srcDir '../src/main/java'
            include 'com/carilt01/trueatmosphere/ModInfo.java'
            include 'com/carilt01/trueatmosphere/AtmosphereSettings.java'
            include 'com/carilt01/trueatmosphere/SkyMode.java'
            include 'com/carilt01/trueatmosphere/client/SkyLut.java'
            include 'com/carilt01/trueatmosphere/client/SkyDomeRenderer.java'
            include 'com/carilt01/trueatmosphere/client/SkyBench.java'
            include 'com/carilt01/trueatmosphere/client/SkySelfTest.java'
            include 'com/carilt01/trueatmosphere/fabric/**'
        }
        resources {
            srcDir '../src/main/resources'
            exclude 'META-INF/**'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'fabric_api_version', project.fabric_api_version
    inputs.property 'minecraft_version', project.minecraft_version

    filesMatching('fabric.mod.json') {
        expand version: project.version,
               loader_version: project.loader_version,
               fabric_api_version: project.fabric_api_version,
               minecraft_version: project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
