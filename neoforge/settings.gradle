pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'trueatmosphere-neoforge'

def matrix = new groovy.json.JsonSlurper().parse(new File(rootDir.parentFile, 'versions.json'))
matrix.versions.each { v ->
    include(v.mc)
    project(":${v.mc}").buildFileName = '../version.build.gradle'
}
