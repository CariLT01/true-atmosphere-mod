def matrixFile = new File(rootDir.parentFile, 'versions.json')
def matrix = new groovy.json.JsonSlurper().parse(matrixFile)
def entry = matrix.versions.find { it.mc == project.name }
if (entry == null) {
    throw new GradleException("versions.json has no entry for Minecraft ${project.name}")
}

apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: 'net.neoforged.moddev'

version = matrix.mod_version
group = matrix.mod_group_id

base {
    archivesName = "${matrix.mod_id}-${entry.mc}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(entry.java)

def neoLine = entry.neoforge.tokenize('.')
def neoFloor = entry.min_neoforge ?: (neoLine[0] + '.' + neoLine[1] + '.0')

project.ext.atmoLoader = 'neoforge'
apply from: new File(rootDir.parentFile, 'gradle/variant-sources.gradle')

repositories {
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.protobuf'
            includeGroup 'io.airlift'
        }
    }
}

dependencies {

    implementation 'com.google.protobuf:protobuf-javalite:4.35.0'
    implementation 'io.airlift:aircompressor:0.27'
    jarJar 'com.google.protobuf:protobuf-javalite:4.35.0'
    jarJar 'io.airlift:aircompressor:0.27'

    def compatDir = new File(rootDir.parentFile, '.compat')
    if (compatDir.isDirectory()) {
        compatDir.listFiles().sort { it.name }.each { dir ->
            def jar = new File(dir, "${entry.mc}-neoforge-${dir.name}.jar")
            if (jar.isFile()) {

                runtimeOnly files(jar)
            }
        }
    }
}

tasks.named('processResources').configure {
    exclude '**.cache'
}

neoForge {
    version = entry.neoforge

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', matrix.mod_id
            if (project.hasProperty('skyMode')) {
                systemProperty 'trueatmosphere.sky', project.skyMode
            }
            if (project.hasProperty('gameArgs')) {
                programArguments.addAll project.property('gameArgs').toString().split(' ')
            }
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', matrix.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gameTestServer')
            systemProperty 'neoforge.enabledGameTestNamespaces', matrix.mod_id
        }

    }

    mods {
        "${matrix.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def mcLine = entry.mc.tokenize('.').collect { it as Integer }
def legacyRuntime = mcLine[0] == 1 && (mcLine[1] < 21 || (mcLine[1] == 21 && mcLine[2] < 9))

if (legacyRuntime) {
    dependencies {
        additionalRuntimeClasspath 'com.google.protobuf:protobuf-javalite:4.35.0'
        additionalRuntimeClasspath 'io.airlift:aircompressor:0.27'
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : entry.mc,
            minecraft_version_range: "[${entry.mc}]",
            neo_version            : neoFloor,
            loader_version_range   : '[1,)',
            mod_id                 : matrix.mod_id,
            mod_name               : matrix.mod_name,
            mod_license            : matrix.mod_license,
            mod_version            : matrix.mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
